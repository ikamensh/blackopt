[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blackopt"
version = "0.28"
description = "black box optimization library"
authors = [{ name = "Ilya Kamen", email = "ikamenshchikov@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "dill>=0.3.0",
    "numpy>=1.24",
    "pathos>=0.2.5",
    "ilya-ezplot>=0.11",
    "structlog>=20.1.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-timeout>=2.0",
]

[tool.pytest.ini_options]
addopts = '-m "not slow"'
markers = [
    "slow: marks tests as slow (run with pytest -m slow to run only these)",
]
